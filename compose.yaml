services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ahabridge
      POSTGRES_USER: ahabridge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ahabridge -d ahabridge"]
      interval: 5s
      timeout: 5s
      retries: 15
  backend:
    build:
      context: .
    environment:
      APP_ENV: development
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      DATABASE_URL: postgresql+psycopg://ahabridge:${POSTGRES_PASSWORD}@db:5432/ahabridge
      DEMO_MODE: ${DEMO_MODE:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      SEED_DEMO: ${SEED_DEMO:-false}
      ECHO_HOURS: ${ECHO_HOURS:-72}
      PORT: 5000
    ports: ["127.0.0.1:5000:5000"]
    depends_on:
      db: {condition: service_healthy}
    volumes: ["./backend:/app/backend"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
  frontend:
    image: node:22-bookworm-slim
    working_dir: /app/frontend
    command: sh -c "npm ci --no-audit --no-fund && npm run dev"
    environment: {API_PROXY_TARGET: "http://backend:5000"}
    ports: ["127.0.0.1:5173:5173"]
    volumes: ["./frontend:/app/frontend", "frontend_modules:/app/frontend/node_modules"]
    depends_on:
      backend: {condition: service_healthy}
volumes:
  postgres_data:
  frontend_modules:
