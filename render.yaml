services:
  - type: web
    name: ahabridge-web
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ahabridge-db
          property: connectionString
      - key: DEMO_MODE
        value: "false"
      - key: SEED_DEMO
        value: "false"
databases:
  - name: ahabridge-db
    plan: free
    region: singapore
    databaseName: ahabridge
    user: ahabridge
