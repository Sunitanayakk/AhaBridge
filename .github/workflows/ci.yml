name: Verify AhaBridge
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_USER: ahabridge, POSTGRES_PASSWORD: ci-only-password, POSTGRES_DB: ahabridge_test}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U ahabridge" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r backend/requirements.lock.txt
      - run: python -m flask --app backend/wsgi.py db upgrade
        env: {DATABASE_URL: 'postgresql+psycopg://ahabridge:ci-only-password@localhost:5432/ahabridge_test'}
      - run: python -m flask --app backend/wsgi.py db downgrade base
        env: {DATABASE_URL: 'postgresql+psycopg://ahabridge:ci-only-password@localhost:5432/ahabridge_test'}
      - run: pytest backend/tests -q
        env: {TEST_DATABASE_URL: 'postgresql+psycopg://ahabridge:ci-only-password@localhost:5432/ahabridge_test'}
  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ahabridge:ci .
